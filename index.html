<!DOCTYPE html>
<html>
<head>
  <title>Culebrita Inteligente</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: blue;
    }
    #gameCanvas {
      display: block;
      background-color: blue;
    }
  </style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const cellSize = 20;
  const cols = Math.floor(canvas.width / cellSize);
  const rows = Math.floor(canvas.height / cellSize);

  let snake = [{x: 5, y: 5}];
  let direction = {x: 1, y: 0};
  let food = spawnFood();
  let interval;
  let growth = 0;

  // Audio
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.type = 'square';
  osc.frequency.value = 200;
  gain.gain.value = 0.05;

  let audioStarted = false;
  function startAudioOnce() {
    if (!audioStarted) {
      audioCtx.resume().then(() => {
        osc.start();
        audioStarted = true;
      });
    }
  }

  // Solo una vez, con cualquier interacción
  window.addEventListener('click', startAudioOnce, { once: true });
  window.addEventListener('keydown', startAudioOnce, { once: true });

  function spawnFood() {
    let emptyCells = [];
    for (let x = 0; x < cols; x++) {
      for (let y = 0; y < rows; y++) {
        if (!snake.some(seg => seg.x === x && seg.y === y)) {
          emptyCells.push({x, y});
        }
      }
    }
    if (emptyCells.length === 0) return null;
    return emptyCells[Math.floor(Math.random() * emptyCells.length)];
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // comida
    if (food) {
      ctx.fillStyle = 'yellow';
      ctx.beginPath();
      ctx.arc(food.x * cellSize + cellSize/2, food.y * cellSize + cellSize/2, cellSize / 2, 0, Math.PI * 2);
      ctx.fill();
    }

    // serpiente
    ctx.fillStyle = 'red';
    snake.forEach(seg => {
      ctx.fillRect(seg.x * cellSize, seg.y * cellSize, cellSize, cellSize);
    });
  }

  function chooseDirection(head) {
    const options = [
      {x: 0, y: -1}, // arriba
      {x: 0, y: 1},  // abajo
      {x: -1, y: 0}, // izquierda
      {x: 1, y: 0},  // derecha
    ];

    let best = null;
    let minDist = Infinity;

    for (let dir of options) {
      let nx = (head.x + dir.x + cols) % cols;
      let ny = (head.y + dir.y + rows) % rows;
      if (snake.some(s => s.x === nx && s.y === ny)) continue;

      let dist = Math.abs(nx - food.x) + Math.abs(ny - food.y);
      if (dist < minDist) {
        minDist = dist;
        best = dir;
      }
    }

    return best || direction;
  }

  function update() {
    let head = snake[0];
    direction = chooseDirection(head);
    let newX = (head.x + direction.x + cols) % cols;
    let newY = (head.y + direction.y + rows) % rows;
    let newHead = {x: newX, y: newY};

    if (snake.some(seg => seg.x === newHead.x && seg.y === newHead.y)) {
      return gameOver();
    }

    snake.unshift(newHead);

    if (food && newHead.x === food.x && newHead.y === food.y) {
      food = spawnFood();
      growth += 3;

      osc.frequency.value += 10;
      gain.gain.value = Math.min(1, gain.gain.value + 0.01);
    }

    if (growth > 0) {
      growth--;
    } else {
      snake.pop();
    }

    draw();
  }

  function gameOver() {
    clearInterval(interval);
    gain.gain.value = 0;

    ctx.fillStyle = 'black';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const deathOsc = audioCtx.createOscillator();
    const deathGain = audioCtx.createGain();
    deathOsc.connect(deathGain);
    deathGain.connect(audioCtx.destination);
    deathOsc.type = 'sine';
    deathOsc.frequency.value = 60;
    deathGain.gain.value = 0.6;
    deathOsc.start();

    setTimeout(() => {
      deathOsc.stop();
      location.reload();
    }, 5000);
  }

  draw();
  interval = setInterval(update, 100);
</script>
</body>
</html>
